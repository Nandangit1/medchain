# Keeps the Render free instance awake.
#
# Render's free tier sleeps after ~15 minutes without traffic, and the next
# visitor waits 30-60 seconds for it to wake -- the main reason the site felt
# slow. A health ping every 10 minutes stops it sleeping. One always-on free
# service uses ~730 of the 750 instance hours Render allows per month.
#
# GitHub may delay scheduled runs at busy times, so an occasional cold start
# can still happen. For a stricter guarantee, also add a free monitor at
# cron-job.org or uptimerobot.com pointing at the same URL every 5 minutes.
#
# GitHub pauses scheduled workflows after 60 days with no commits; re-enable
# it from the Actions tab if that happens.

name: Keep site awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: |
          curl --silent --show-error --max-time 90 --retry 2 \
            --output /dev/null --write-out "HTTP %{http_code} in %{time_total}s\n" \
            https://medchain-y4k0.onrender.com/api/v1/health
