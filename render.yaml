# MedChain — deployment blueprint for Render.
#
# Render reads this file and provisions everything described. The free tier is
# enough for a project demo.
#
# ONE-TIME SETUP (needs your accounts — nobody can do this on your behalf):
#
#   1. Push this repository to GitHub.
#   2. Create a free MongoDB Atlas cluster and copy its connection string.
#   3. On render.com: New -> Blueprint -> select your repository.
#   4. Fill in the four values marked `sync: false` when prompted.
#   5. Deploy. You get https://medchain.onrender.com with TLS included.
#
# For a custom domain (medchain.com or similar) you must buy the domain, then
# add it under Settings -> Custom Domains and point its DNS at Render.
#
# Free-tier caveat: the instance sleeps after ~15 minutes idle, so the first
# request afterwards takes 30-60 seconds. Fine for a demo; mention it if an
# examiner sees a slow first load.

services:
  - type: web
    name: medchain
    runtime: node
    plan: free
    region: singapore
    # Must match a branch that actually exists on GitHub. This repository uses
    # `master`, not `main` — Render fails to find the blueprint otherwise.
    branch: master

    # `--include=dev` on the frontend install is load-bearing, not belt-and-braces.
    # NODE_ENV=production is set below and npm honours it during install, so a
    # plain `npm ci` here skips devDependencies -- which is where vite lives.
    # The build then dies with "sh: 1: vite: not found" after installing only
    # the 12 runtime packages. The backend install keeps --omit=dev because it
    # genuinely wants runtime deps only.
    buildCommand: npm --prefix frontend ci --include=dev && npm --prefix frontend run build && npm --prefix backend ci --omit=dev
    startCommand: node backend/src/server.js

    healthCheckPath: /api/v1/health

    envVars:
      - key: NODE_ENV
        value: production

      # One process serves the built React app and the API together.
      - key: SERVE_FRONTEND
        value: "true"

      # Read by vite at BUILD time and baked into the bundle, so it has to be
      # set here rather than discovered at runtime. frontend/.env carries this
      # locally but is gitignored, so it does not exist on a build machine --
      # without this the bundle falls back to a hardcoded host and every
      # visitor's browser calls its own localhost instead of the server.
      # Relative because one origin serves both the app and the API.
      - key: VITE_API_URL
        value: /api/v1

      # Render terminates TLS, so the secure cookie flag is correct here.
      - key: TRUST_TLS
        value: "true"

      # Left ON for the first deploy. A fresh Atlas database has no indexes at
      # all, and two of them are load-bearing rather than merely fast: the
      # partial uniques on access grants and appointment slots. Disabling index
      # building before they exist gives you a site that accepts duplicate
      # registrations. Once `npm run ensure:indexes` has been run against the
      # cluster (deployment-guide section 2), flip this to "true" so restarts
      # stop re-checking them.
      - key: DISABLE_AUTO_INDEX
        value: "false"

      # Registration only ever mints patients and doctors, so the administrator
      # has to be seeded. The free plan has no pre-deploy command and no shell,
      # which leaves startup as the only place this can happen. The seed is
      # idempotent and never touches an existing account's password.
      - key: SEED_ADMIN_ON_BOOT
        value: "true"

      # --- Secrets: entered in the Render dashboard, never committed ---------

      - key: MONGODB_URI
        sync: false

      # Generate each with:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: JWT_SECRET
        sync: false

      # Losing this makes every stored medical record permanently unreadable.
      # Back it up somewhere outside the platform.
      - key: FILE_ENCRYPTION_KEY
        sync: false

      # Changing this orphans every user's on-chain identity.
      - key: CUSTODIAL_WALLET_SEED
        sync: false

      # ADMIN_NAME is not a secret, but the seeder requires all three.
      - key: ADMIN_NAME
        value: MedChain Administrator
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # --- Storage ----------------------------------------------------------
      # Render's filesystem is ephemeral, so the local IPFS driver would lose
      # files on every restart. Pinata is required in production.
      - key: IPFS_DRIVER
        value: pinata
      - key: PINATA_JWT
        sync: false
      - key: PINATA_GATEWAY_URL
        sync: false

      # --- Blockchain -------------------------------------------------------
      # Leave BLOCKCHAIN_ENABLED false until the contract is on a public
      # testnet. The app runs fully without it: records are still encrypted and
      # stored, and stay at blockchain.status "pending" until you enable it and
      # run `npm run backfill:anchors`.
      - key: BLOCKCHAIN_ENABLED
        value: "false"
      - key: BLOCKCHAIN_RPC_URL
        sync: false
      - key: BLOCKCHAIN_CHAIN_ID
        value: "11155111"
      # A public chain can reorg; one confirmation is not enough.
      - key: BLOCKCHAIN_CONFIRMATIONS
        value: "2"
      - key: CONTRACT_ADDRESS
        sync: false
      - key: REGISTRAR_PRIVATE_KEY
        sync: false

      # Render injects the public URL, which the CORS allow-list reuses so the
      # origin never has to be hardcoded.
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: medchain
          envVarKey: RENDER_EXTERNAL_URL

      # Set explicitly rather than left to fall back to the first CORS origin.
      # CORS_ORIGIN is a SET of permitted origins; a password-reset link needs
      # exactly one, and would be built from a comma-joined string the moment a
      # second origin is added here.
      - key: APP_URL
        fromService:
          type: web
          name: medchain
          envVarKey: RENDER_EXTERNAL_URL

      # --- Email -----------------------------------------------------------
      # Left off, which routes every message to the application log instead of
      # a mailbox. Password reset still works: the link appears in the Render
      # log stream. To use a real inbox, add SMTP_HOST, SMTP_USER and
      # SMTP_PASSWORD in the dashboard and flip this to "true" -- with Gmail
      # that means an app password, not the account one.
      #
      # Those three are deliberately NOT declared here. Every `sync: false` key
      # becomes a field the Blueprint wizard asks for up front, and a first
      # deploy should not have to answer questions about features it is not
      # turning on. Adding them later in the dashboard works identically.
      - key: MAIL_ENABLED
        value: "false"
      - key: SMTP_PORT
        value: "587"
      - key: MAIL_FROM
        value: MedChain <no-reply@medchain.local>

      # --- Two-factor authentication ---------------------------------------
      # Prompting is on for clinicians and admins; ENFORCEMENT is deliberately
      # off. Turning enforcement on before anyone has enrolled locks the
      # deployment out of its own admin account. Enrol first, then flip it.
      - key: MFA_REQUIRED_ROLES
        value: doctor,admin
      - key: MFA_ENFORCED
        value: "false"

      # --- Video consultation ----------------------------------------------
      # The public Jitsi instance needs no account and no API key. Point this
      # at a self-hosted deployment to keep consultation media in your own
      # infrastructure; that value is the only change required.
      - key: JITSI_DOMAIN
        value: meet.jit.si

      # --- ABDM ------------------------------------------------------------
      # "mock" validates the ABHA format and its Verhoeff checksum offline and
      # never claims an identity was verified -- the UI says so on the page.
      # For the real gateway set this to "nha" and add ABDM_CLIENT_ID and
      # ABDM_CLIENT_SECRET in the dashboard; that needs a registered sandbox
      # client, which is an application process rather than a signup.
      - key: ABHA_DRIVER
        value: mock

      # --- Ambient scribe ---------------------------------------------------
      # "mock" derives the draft note from the transcript offline and invents
      # no clinical content. For the real model set this to "claude" and add
      # ANTHROPIC_API_KEY in the dashboard. Either way a clinician signs before
      # any record exists -- the driver only affects the draft.
      - key: SCRIBE_DRIVER
        value: mock
